<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestra Galaxia - 3 Años y 10 Meses</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background-color: #03000a; font-family: sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
        .glass { background: rgba(10, 10, 25, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="text-white">

    <!-- Interfaz Superior -->
    <div class="absolute top-4 left-0 right-0 z-10 flex flex-col items-center pointer-events-none px-4">
        <h1 class="text-2xl sm:text-4xl font-extrabold tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-pink-400 via-purple-300 to-indigo-400 text-center drop-shadow-lg">
            3 AÑOS Y 10 MESES
        </h1>
        <p class="text-xs sm:text-sm text-pink-200/80 mt-1 tracking-wider text-center">46 meses creando nuestro propio universo juntos ✨</p>
    </div>

    <!-- Controles Flotantes inferiores -->
    <div class="absolute bottom-6 left-0 right-0 z-10 flex justify-center items-center gap-4 px-4 pointer-events-auto">
        <button onclick="toggleAudio()" id="audio-btn" class="glass px-5 py-3 rounded-full font-medium text-sm flex items-center gap-2 hover:bg-white/20 transition shadow-lg text-pink-300">
            <i class="fas fa-music text-lg"></i> <span id="audio-text">Activar Música</span>
        </button>
        <button onclick="resetCamera()" class="glass px-5 py-3 rounded-full font-medium text-sm flex items-center gap-2 hover:bg-white/20 transition shadow-lg text-indigo-300">
            <i class="fas fa-undo text-lg"></i> Centrar Vista
        </button>
    </div>

    <!-- Modal de Recuerdos -->
    <div id="memory-modal" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50 p-4" onclick="closeMemory()">
        <div class="glass max-w-md w-full p-6 rounded-2xl text-center relative shadow-2xl border border-pink-500/30" onclick="event.stopPropagation()">
            <button onclick="closeMemory()" class="absolute top-3 right-4 text-gray-400 hover:text-white text-2xl">&times;</button>
            <div id="memory-icon" class="text-4xl text-pink-400 mb-3"><i class="fas fa-heart"></i></div>
            <h3 id="memory-title" class="text-xl font-bold text-pink-200 mb-2"></h3>
            <p id="memory-desc" class="text-gray-300 text-sm leading-relaxed"></p>
        </div>
    </div>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Escena, Cámara y Renderizador
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x03000a, 0.002);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 35, 60);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // Controles de Cámara Manuales (Mouse / Touch)
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let cameraAngleX = 0, cameraAngleY = 0.6;
        let cameraDistance = 70;

        window.addEventListener('mousedown', (e) => { isDragging = true; previousMousePosition = { x: e.clientX, y: e.clientY }; });
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - previousMousePosition.x;
            const deltaY = e.clientY - previousMousePosition.y;
            cameraAngleX -= deltaX * 0.005;
            cameraAngleY = Math.max(0.1, Math.min(Math.PI / 2 - 0.05, cameraAngleY + deltaY * 0.005));
            previousMousePosition = { x: e.clientX, y: e.clientY };
            updateCameraPosition();
        });
        window.addEventListener('mouseup', () => { isDragging = false; });

        // Touch support
        window.addEventListener('touchstart', (e) => {
            if(e.touches.length === 1) {
                isDragging = true;
                previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
        });
        window.addEventListener('touchmove', (e) => {
            if (!isDragging || e.touches.length !== 1) return;
            const deltaX = e.touches[0].clientX - previousMousePosition.x;
            const deltaY = e.touches[0].clientY - previousMousePosition.y;
            cameraAngleX -= deltaX * 0.005;
            cameraAngleY = Math.max(0.1, Math.min(Math.PI / 2 - 0.05, cameraAngleY + deltaY * 0.005));
            previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            updateCameraPosition();
        });
        window.addEventListener('touchend', () => { isDragging = false; });

        function updateCameraPosition() {
            camera.position.x = cameraDistance * Math.sin(cameraAngleY) * Math.sin(cameraAngleX);
            camera.position.y = cameraDistance * Math.cos(cameraAngleY);
            camera.position.z = cameraDistance * Math.sin(cameraAngleY) * Math.cos(cameraAngleX);
            camera.lookAt(0, 0, 0);
        }
        function resetCamera() {
            cameraAngleX = 0; cameraAngleY = 0.6; cameraDistance = 70;
            updateCameraPosition();
        }
        resetCamera();

        // Galaxia Espiral de Estrellas
        const particleCount = 15000;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);

        const colorInside = new THREE.Color('#ff66b2');
        const colorOutside = new THREE.Color('#4169e1');

        for (let i = 0; i < particleCount; i++) {
            const i3 = i * 3;
            const radius = Math.random() * 45;
            const spinAngle = radius * 0.3;
            const branchAngle = ((i % 3) * Math.PI * 2) / 3;

            const randomX = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 4;
            const randomY = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 4;
            const randomZ = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 4;

            positions[i3] = Math.cos(branchAngle + spinAngle) * radius + randomX;
            positions[i3 + 1] = randomY;
            positions[i3 + 2] = Math.sin(branchAngle + spinAngle) * radius + randomZ;

            // Gradiente de color
            const mixedColor = colorInside.clone();
            mixedColor.lerp(colorOutside, radius / 45);
            colors[i3] = mixedColor.r;
            colors[i3 + 1] = mixedColor.g;
            colors[i3 + 2] = mixedColor.b;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const material = new THREE.PointsMaterial({
            size: 0.12,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            transparent: true,
            opacity: 0.8
        });

        const galaxy = new THREE.Points(geometry, material);
        scene.add(galaxy);

        // Núcleo Central en forma de Corazón 3D / Esfera Brillante
        const coreGeometry = new THREE.SphereGeometry(2.5, 32, 32);
        const coreMaterial = new THREE.MeshBasicMaterial({ color: 0xff3399 });
        const coreMesh = new THREE.Mesh(coreGeometry, coreMaterial);
        scene.add(coreMesh);

        // Orbes Interactivos (Representando los 46 meses)
        const interactiveGroup = new THREE.Group();
        scene.add(interactiveGroup);

        const memories = [
            { title: "Mes 1: El Inicio", desc: "El instante mágico en que nuestros caminos se cruzaron y comenzó esta hermosa historia." },
            { title: "Mes 12: Primer Aniversario", desc: "365 días de risas, complicidad y un amor que no hizo más que fortalecerse." },
            { title: "Mes 24: Dos Años Juntos", desc: "Consolidando nuestros sueños y construyendo recuerdos inolvidables paso a paso." },
            { title: "Mes 36: Tres Años de Magia", desc: "Superando cualquier reto con la certeza de que estamos hechos el uno para el otro." },
            { title: "Mes 46: ¡3 Años y 10 Meses!", desc: "El momento presente. 46 meses de amor sincero, paciencia y felicidad infinita a tu lado." }
        ];

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const interactiveOrbs = [];

        for (let i = 0; i < 8; i++) {
            const angle = (i / 8) * Math.PI * 2;
            const distance = 12 + (i * 2.5);
            const orbGeo = new THREE.SphereGeometry(0.8, 16, 16);
            const orbMat = new THREE.MeshBasicMaterial({ color: 0xffb6c1, wireframe: true });
            const orb = new THREE.Mesh(orbGeo, orbMat);

            orb.position.x = Math.cos(angle) * distance;
            orb.position.z = Math.sin(angle) * distance;
            orb.userData = memories[i % memories.length];

            interactiveGroup.add(orb);
            interactiveOrbs.push(orb);
        }

        window.addEventListener('click', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(interactiveOrbs);

            if (intersects.length > 0) {
                const data = intersects[0].object.userData;
                showMemory(data.title, data.desc);
            }
        });

        function showMemory(title, desc) {
            document.getElementById('memory-title').innerText = title;
            document.getElementById('memory-desc').innerText = desc;
            document.getElementById('memory-modal').classList.remove('hidden');
            document.getElementById('memory-modal').classList.add('flex');
        }
        function closeMemory() {
            document.getElementById('memory-modal').classList.add('hidden');
            document.getElementById('memory-modal').classList.remove('flex');
        }

        // Web Audio API para música ambiental espacial
        let audioCtx = null;
        let isPlaying = false;
        let oscillators = [];

        function toggleAudio() {
            if (!isPlaying) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const notes = [220, 277.18, 329.63, 440, 554.37]; // Acorde romántico etéreo
                oscillators = notes.map(freq => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    return { osc, gain };
                });
                isPlaying = true;
                document.getElementById('audio-text').innerText = "Pausar Música";
                document.getElementById('audio-btn').classList.add('bg-pink-500/30');
            } else {
                if (audioCtx) {
                    oscillators.forEach(item => item.osc.stop());
                    audioCtx.close();
                }
                isPlaying = false;
                document.getElementById('audio-text').innerText = "Activar Música";
                document.getElementById('audio-btn').classList.remove('bg-pink-500/30');
            }
        }

        // Animación Principal
        function animate() {
            requestAnimationFrame(animate);
            galaxy.rotation.y += 0.001;
            interactiveGroup.rotation.y -= 0.0015;

            // Pulso suave en el núcleo
            const scale = 1 + Math.sin(Date.now() * 0.003) * 0.15;
            coreMesh.scale.set(scale, scale, scale);

            renderer.render(scene, camera);
        }
        animate();

        // Responsive Window Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
