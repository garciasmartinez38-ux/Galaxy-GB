<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestro Universo - A Distancia Pero Juntos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background-color: #03000a; font-family: sans-serif; }
        canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; display: block; }
        .glass { background: rgba(10, 10, 25, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.15); }
    </style>
</head>
<body class="text-white">

    <!-- Encabezado -->
    <div class="absolute top-4 left-0 right-0 z-20 flex flex-col items-center pointer-events-none px-4">
        <h1 class="text-2xl sm:text-4xl font-extrabold tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-pink-400 via-yellow-300 to-indigo-400 text-center drop-shadow-lg">
            3 AÑOS Y 10 MESES
        </h1>
        <p class="text-xs sm:text-sm text-pink-200/80 mt-1 tracking-wider text-center">46 meses acortando la distancia con amor y un mismo cielo ✨</p>
    </div>

    <!-- Botones de Acción -->
    <div class="absolute bottom-6 left-0 right-0 z-20 flex justify-center items-center gap-4 px-4 pointer-events-auto">
        <button onclick="toggleAudio()" id="audio-btn" class="glass px-5 py-3 rounded-full font-medium text-sm flex items-center gap-2 hover:bg-white/20 transition shadow-lg text-pink-300">
            <i class="fas fa-music text-lg"></i> <span id="audio-text">Activar Música</span>
        </button>
        <button onclick="resetCamera()" class="glass px-5 py-3 rounded-full font-medium text-sm flex items-center gap-2 hover:bg-white/20 transition shadow-lg text-indigo-300">
            <i class="fas fa-undo text-lg"></i> Centrar Vista
        </button>
    </div>

    <!-- Modal de Mensajes de Amor a Distancia -->
    <div id="memory-modal" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50 p-4" onclick="closeModal('memory-modal')">
        <div class="glass max-w-md w-full p-6 rounded-2xl text-center relative shadow-2xl border border-yellow-500/40" onclick="event.stopPropagation()">
            <button onclick="closeModal('memory-modal')" class="absolute top-3 right-4 text-gray-400 hover:text-white text-2xl">&times;</button>
            <div id="memory-icon" class="text-4xl text-yellow-400 mb-3"><i class="fas fa-globe-americas"></i></div>
            <h3 id="memory-title" class="text-xl font-bold text-yellow-200 mb-2"></h3>
            <p id="memory-desc" class="text-gray-200 text-sm leading-relaxed whitespace-pre-line"></p>
        </div>
    </div>

    <!-- Modal de Galería de Fotos (Núcleo Central) -->
    <div id="photo-modal" class="fixed inset-0 bg-black/90 hidden items-center justify-center z-50 p-4" onclick="closeModal('photo-modal')">
        <div class="glass max-w-lg w-full p-5 rounded-2xl text-center relative border border-pink-400/40" onclick="event.stopPropagation()">
            <button onclick="closeModal('photo-modal')" class="absolute top-3 right-4 text-gray-400 hover:text-white text-2xl">&times;</button>
            <h3 class="text-lg font-bold text-pink-300 mb-3"><i class="fas fa-camera"></i> Nuestros Recuerdos Juntos</h3>
            
            <div class="relative flex items-center justify-center bg-black/50 rounded-xl overflow-hidden p-2">
                <img id="gallery-img" src="mibebe1.jpg" class="w-full max-h-[60vh] object-contain rounded-lg shadow-lg" alt="Foto Juntos">
            </div>
            
            <p id="gallery-caption" class="text-xs text-pink-200 mt-3">A pesar de la distancia, siempre en mi corazón</p>
            
            <div class="flex justify-between items-center mt-4 px-2">
                <button onclick="prevPhoto()" class="px-4 py-2 bg-white/10 hover:bg-white/20 rounded-full text-xs text-pink-200"><i class="fas fa-chevron-left"></i> Anterior</button>
                <span id="photo-counter" class="text-xs text-gray-400">1 de 4</span>
                <button onclick="nextPhoto()" class="px-4 py-2 bg-white/10 hover:bg-white/20 rounded-full text-xs text-pink-200">Siguiente <i class="fas fa-chevron-right"></i></button>
            </div>
        </div>
    </div>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x03000a, 0.002);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let cameraAngleX = 0, cameraAngleY = 0.6, cameraDistance = 70;

        window.addEventListener('mousedown', (e) => { isDragging = true; previousMousePosition = { x: e.clientX, y: e.clientY }; });
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - previousMousePosition.x;
            const deltaY = e.clientY - previousMousePosition.y;
            cameraAngleX -= deltaX * 0.005;
            cameraAngleY = Math.max(0.1, Math.min(Math.PI / 2 - 0.05, cameraAngleY + deltaY * 0.005));
            previousMousePosition = { x: e.clientX, y: e.clientY };
            updateCameraPosition();
        });
        window.addEventListener('mouseup', () => { isDragging = false; });

        window.addEventListener('touchstart', (e) => {
            if(e.touches.length === 1) {
                isDragging = true;
                previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
        });
        window.addEventListener('touchmove', (e) => {
            if (!isDragging || e.touches.length !== 1) return;
            const deltaX = e.touches[0].clientX - previousMousePosition.x;
            const deltaY = e.touches[0].clientY - previousMousePosition.y;
            cameraAngleX -= deltaX * 0.005;
            cameraAngleY = Math.max(0.1, Math.min(Math.PI / 2 - 0.05, cameraAngleY + deltaY * 0.005));
            previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            updateCameraPosition();
        });
        window.addEventListener('touchend', () => { isDragging = false; });

        function updateCameraPosition() {
            camera.position.x = cameraDistance * Math.sin(cameraAngleY) * Math.sin(cameraAngleX);
            camera.position.y = cameraDistance * Math.cos(cameraAngleY);
            camera.position.z = cameraDistance * Math.sin(cameraAngleY) * Math.cos(cameraAngleX);
            camera.lookAt(0, 0, 0);
        }
        function resetCamera() {
            cameraAngleX = 0; cameraAngleY = 0.6; cameraDistance = 70;
            updateCameraPosition();
        }
        resetCamera();

        // Galaxia de Estrellas
        const particleCount = 12000;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);
        const colorInside = new THREE.Color('#ffaa00');
        const colorOutside = new THREE.Color('#4169e1');

        for (let i = 0; i < particleCount; i++) {
            const i3 = i * 3;
            const radius = Math.random() * 45;
            const spinAngle = radius * 0.3;
            const branchAngle = ((i % 3) * Math.PI * 2) / 3;

            positions[i3] = Math.cos(branchAngle + spinAngle) * radius + (Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 4);
            positions[i3 + 1] = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 4;
            positions[i3 + 2] = Math.sin(branchAngle + spinAngle) * radius + (Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 4);

            const mixedColor = colorInside.clone().lerp(colorOutside, radius / 45);
            colors[i3] = mixedColor.r; colors[i3 + 1] = mixedColor.g; colors[i3 + 2] = mixedColor.b;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        const galaxy = new THREE.Points(geometry, new THREE.PointsMaterial({ size: 0.12, vertexColors: true, blending: THREE.AdditiveBlending, transparent: true, opacity: 0.8 }));
        scene.add(galaxy);

        // Núcleo Central (Planeta Rosa Brillante - Fotos)
        const coreGeo = new THREE.SphereGeometry(3.5, 32, 32);
        const coreMat = new THREE.MeshBasicMaterial({ color: 0xff1493 });
        const coreMesh = new THREE.Mesh(coreGeo, coreMat);
        coreMesh.userData = { isCore: true };
        scene.add(coreMesh);

        // Planetas en Órbita con Mensajes de Amor a Distancia
        const interactiveGroup = new THREE.Group();
        scene.add(interactiveGroup);

        const planetMessages = [
            { title: "🌍 La Distancia no Importa", desc: "Aunque nos separen kilómetros, mi corazón late al mismo ritmo que el tuyo todos los días." },
            { title: "💻 Pantallas que Unen", desc: "Amo cada videollamada y mensaje; eres lo primero que pienso al despertar y lo último al dormir." },
            { title: "⏳ Contando los Días", desc: "Cada día que pasa es uno menos para vernos en persona y abrazarnos por fin muy fuerte." },
            { title: "✈️ Nuestro Vuelo", desc: "Ninguna distancia física puede apagar lo nuestro; nuestro amor rompe cualquier barrera del mapa." },
            { title: "💌 Cartas y Mensajes", desc: "Tus audios y textos son mi refugio favorito cuando más extraño escuchar tu voz en persona." },
            { title: "✨ Un Mismo Cielo", desc: "Aunque estemos lejos, recuerda que bajo este mismo cielo y estas estrellas siempre estamos conectados." },
            { title: "💖 Abrazos Virtuales", desc: "Te envío abrazos virtuales llenos de todo mi amor hasta que pueda dártelos cerquita." },
            { title: "🌟 Mi Lugar Seguro", desc: "Aunque no pueda tocarte ahora mismo, te siento muy dentro de mi pecho cada segundo." },
            { title: "🚀 Nuestro Destino", desc: "Construir este futuro juntos vale cada esfuerzo y cada kilómetro. ¡Te amo muchísimo!" },
            { title: "💫 Promesa Eterna", desc: "Vales cada segundo de espera. Esto es solo una etapa hermosa hacia nuestra vida juntos. ¡Feliz aniversario!" }
        ];

        // Colores variados para que parezcan planetas reales
        const planetColors = [0xffd700, 0xff8c00, 0xff69b4, 0x00ffff, 0xdda0dd, 0x00fa9a, 0xff4500, 0x1e90ff, 0xee82ee, 0xadff2f];

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const clickableObjects = [coreMesh];

        for (let i = 0; i < planetMessages.length; i++) {
            const angle = (i / planetMessages.length) * Math.PI * 2;
            const distance = 15 + (i % 3 * 3); // Diferentes órbitas
            const orbGeo = new THREE.SphereGeometry(1.1, 16, 16);
            const orbMat = new THREE.MeshBasicMaterial({ color: planetColors[i], wireframe: false });
            const orb = new THREE.Mesh(orbGeo, orbMat);

            orb.position.x = Math.cos(angle) * distance;
            orb.position.z = Math.sin(angle) * distance;
            orb.userData = planetMessages[i];

            interactiveGroup.add(orb);
            clickableObjects.push(orb);
        }

        window.addEventListener('click', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(clickableObjects);

            if (intersects.length > 0) {
                const clickedObj = intersects[0].object;
                if (clickedObj.userData.isCore) {
                    openPhotoGallery();
                } else {
                    showMemory(clickedObj.userData.title, clickedObj.userData.desc);
                }
            }
        });

        function showMemory(title, desc) {
            document.getElementById('memory-title').innerText = title;
            document.getElementById('memory-desc').innerText = desc;
            document.getElementById('memory-modal').classList.remove('hidden');
            document.getElementById('memory-modal').classList.add('flex');
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
            document.getElementById(id).classList.remove('flex');
        }

        const photos = [
            { url: "mibebe1.jpg", caption: "Nuestro primer gran recuerdo juntos ❤️" },
            { url: "mibebe2.jpg", caption: "Momentos mágicos e inolvidables ✨" },
            { url: "mibebe3.jpg", caption: "Celebrando nuestro amor cada día 🌹" },
            { url: "mibebe4.jpg", caption: "¡Te amo con todo mi corazón! 🥰" }
        ];
        let currentPhotoIdx = 0;

        function openPhotoGallery() {
            currentPhotoIdx = 0;
            updatePhoto();
            document.getElementById('photo-modal').classList.remove('hidden');
            document.getElementById('photo-modal').classList.add('flex');
        }

        function updatePhoto() {
            document.getElementById('gallery-img').src = photos[currentPhotoIdx].url;
            document.getElementById('gallery-caption').innerText = photos[currentPhotoIdx].caption;
            document.getElementById('photo-counter').innerText = `${currentPhotoIdx + 1} de ${photos.length}`;
        }

        function nextPhoto() {
            currentPhotoIdx = (currentPhotoIdx + 1) % photos.length;
            updatePhoto();
        }

        function prevPhoto() {
            currentPhotoIdx = (currentPhotoIdx - 1 + photos.length) % photos.length;
            updatePhoto();
        }

        let audioCtx = null, isPlaying = false, oscillators = [];
        function toggleAudio() {
            if (!isPlaying) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const notes = [220, 277.18, 329.63, 440, 554.37];
                oscillators = notes.map(freq => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    return { osc, gain };
                });
                isPlaying = true;
                document.getElementById('audio-text').innerText = "Pausar Música";
            } else {
                if (audioCtx) { oscillators.forEach(i => i.osc.stop()); audioCtx.close(); }
                isPlaying = false;
                document.getElementById('audio-text').innerText = "Activar Música";
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            galaxy.rotation.y += 0.001;
            interactiveGroup.rotation.y -= 0.0015;
            const s = 1 + Math.sin(Date.now() * 0.003) * 0.12;
            coreMesh.scale.set(s, s, s);
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
